name: "Alder"
run-name: "Prism"
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  pages: write
  contents: read
  id-token: write
jobs:
  ARROW:
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.GARDEN.outputs.page_url }}
    steps:
      - name: "Sitka"
        uses: actions/checkout@v5
      - name: "Banner"
        uses: actions/configure-pages@v6
      - name: "Opal"
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: "gravel"
        id: GARDEN
        uses: actions/deploy-pages@v5
